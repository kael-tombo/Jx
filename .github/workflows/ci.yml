name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt / clippy / tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  deny:
    name: licences and advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The site job runs on Linux, where winget and Chocolatey do not exist. This
  # Windows job exercises the real Chocolatey packer and Ruby on every push;
  # the renderer uses only Node built-ins, so no install step is needed.
  packages:
    name: OS package manifests (real validators)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Renderer tests
        run: npm run test:packages
      - name: Validate with the tools the runner has
        run: npm run validate:packages

  # The brief asks CI to track binary size and startup time once there is a
  # binary worth measuring; added when M1 lands a real command budget.

  site:
    name: site (checks, axe, Lighthouse mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install site tooling
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Content, contrast, markup and links
        run: npm run check
      - name: Spellcheck
        run: npm run spellcheck
      - name: Package-manager manifest renderer
        run: npm run test:packages
      - name: Package-manager manifests (real validators when available)
        run: npm run validate:packages
      - name: Playwright and axe (light and dark)
        run: npm test
      - name: Resolve the browser for Lighthouse
        run: echo "CHROME_PATH=$(node tests/chrome-path.mjs)" >> "$GITHUB_ENV"
      - name: Lighthouse mobile budgets
        run: npm run lighthouse
