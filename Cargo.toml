[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
jx-common = { path = "crates/jx-common" }
jx-manifest = { path = "crates/jx-manifest" }
jx-lock = { path = "crates/jx-lock" }
jx-maven = { path = "crates/jx-maven" }
jx-resolve = { path = "crates/jx-resolve" }
jx-testsupport = { path = "crates/jx-testsupport" }
jx-toolchain = { path = "crates/jx-toolchain" }
jx-build = { path = "crates/jx-build" }
jx-run = { path = "crates/jx-run" }
jx-package = { path = "crates/jx-package" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
hex = "0.4"
fs4 = "0.8"
ureq = { version = "2", features = ["json", "gzip"] }
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.release]
# Reviewed again for M8 release hardening; conservative defaults for now.
lto = true
codegen-units = 1
